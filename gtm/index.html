<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rookie Card Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a 1950s corner-store counter. Cream paper ground, a waxed paper pack with a crimped top; tear the crimp,
   the graded card rises, then turns to its landscape back. Single deliberate light look (vintage print), not themed. */
:root{
  --paper:#f3ead6; --paper-2:#e9dcc0; --ink:#1d2742; --ink-2:#3a4366; --muted:#6f6552; --rule:#cdbd98;
  --accent:#b3302a; --accent-2:#d9584f; --cream:#fbf6ea;
  --display:Oswald,"Arial Narrow",Impact,sans-serif;
  --serif:"Libre Caslon Text",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cw:300px; --ch:calc(var(--cw) * 1.5);
  --bg:#0f1220; --bg-2:#181c30; --fg:#eef0fa; --fg-muted:#a3a8c2;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--serif);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:14px 14px;overflow-x:hidden;min-height:100%;
  background:
    radial-gradient(1100px 600px at 50% -8%, #262b4d 0%, rgba(15,18,32,0) 62%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    var(--bg)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2)}
header h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.005em;text-wrap:balance}
header h1 em{font-style:italic;color:var(--accent-2)}
header p{margin:0;color:var(--fg-muted);font-style:italic;max-width:46ch}
.rule{display:flex;align-items:center;gap:10px;width:min(420px,80%);margin-top:4px}
.rule::before,.rule::after{content:"";flex:1;border-top:3px double var(--fg-muted)}
.rule span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--fg-muted)}

/* ---------- stage ---------- */
.stage{position:relative;overflow:clip;height:var(--sh,calc(var(--ch) + 40px));min-height:300px;display:grid;place-items:center;perspective:1600px}
.glow{position:absolute;width:min(520px,100%);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, rgba(242,210,140,.22), rgba(242,210,140,0) 64%);opacity:0;transition:opacity .8s;pointer-events:none}
.stage.revealed .glow{opacity:1}

/* pack: waxed paper wrapper */
.pack{position:absolute;width:250px;aspect-ratio:250/370;zoom:var(--pz,1);transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity .5s;touch-action:none;user-select:none;z-index:2;
  filter:drop-shadow(0 22px 30px rgba(0,0,0,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.pack.idle{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.8deg)}}
.pack.shake{animation:shake .35s linear 2}
@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.pack.gone{transform:translateY(240px) scale(.9);opacity:0;pointer-events:none}
.foil{position:absolute;inset:0;overflow:hidden;
  background:
    linear-gradient(105deg, transparent 38%, rgba(255,255,255,.55) 46%, rgba(255,255,255,0) 54%) 0 0/260% 100%,
    repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb,var(--accent) 16%,transparent) 22px 30px),
    linear-gradient(180deg,#fbf3df,#efe2c2);
  animation:wax 6s ease-in-out infinite}
@keyframes wax{0%,20%{background-position:120% 0,0 0,0 0}60%,100%{background-position:-60% 0,0 0,0 0}}
/* crimped top edge: zigzag seam at 17% */
.body-part{clip-path:polygon(0 17%,4% 15.5%,8% 17%,12% 15.5%,16% 17%,20% 15.5%,24% 17%,28% 15.5%,32% 17%,36% 15.5%,40% 17%,44% 15.5%,48% 17%,52% 15.5%,56% 17%,60% 15.5%,64% 17%,68% 15.5%,72% 17%,76% 15.5%,80% 17%,84% 15.5%,88% 17%,92% 15.5%,96% 17%,100% 15.5%,100% 97%,96% 98.5%,92% 97%,88% 98.5%,84% 97%,80% 98.5%,76% 97%,72% 98.5%,68% 97%,64% 98.5%,60% 97%,56% 98.5%,52% 97%,48% 98.5%,44% 97%,40% 98.5%,36% 97%,32% 98.5%,28% 97%,24% 98.5%,20% 97%,16% 98.5%,12% 97%,8% 98.5%,4% 97%,0 98.5%)}
.strip{clip-path:polygon(0 1.5%,4% 0,8% 1.5%,12% 0,16% 1.5%,20% 0,24% 1.5%,28% 0,32% 1.5%,36% 0,40% 1.5%,44% 0,48% 1.5%,52% 0,56% 1.5%,60% 0,64% 1.5%,68% 0,72% 1.5%,76% 0,80% 1.5%,84% 0,88% 1.5%,92% 0,96% 1.5%,100% 0,100% 15.5%,96% 17%,92% 15.5%,88% 17%,84% 15.5%,80% 17%,76% 15.5%,72% 17%,68% 15.5%,64% 17%,60% 15.5%,56% 17%,52% 15.5%,48% 17%,44% 15.5%,40% 17%,36% 15.5%,32% 17%,28% 15.5%,24% 17%,20% 15.5%,16% 17%,12% 15.5%,8% 17%,4% 15.5%,0 17%);
  transition:transform .7s cubic-bezier(.3,.6,.2,1), opacity .7s;cursor:grab;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 6px),
    linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 80%,#000)) !important}
.strip.torn{transform:translate(150px,-210px) rotate(32deg);opacity:0}
.strip:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.pack-label{position:absolute;inset:17% 0 3% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px 18px;text-align:center;pointer-events:none}
.pack-label .series{font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.22em;color:var(--ink-2)}
.badge{width:84%;border:2px solid var(--ink);border-radius:50%/42%;padding:18px 8px 16px;background:var(--cream);box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 5px var(--accent)}
.badge .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--accent);font-weight:600}
.pack-label .big{font-family:var(--display);font-weight:700;font-size:clamp(32px,10vw,42px);line-height:.9;text-transform:uppercase;color:var(--ink);margin:4px 0 2px;letter-spacing:.01em}
.badge .no{display:block;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-2)}
.pack-label .count{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.12em;padding:4px 10px;background:var(--ink);color:var(--cream)}
.tear-hint{position:absolute;top:4.5%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.18em;color:var(--cream);pointer-events:none}
.tear-hint i{display:block;width:36px;height:0;border-top:1.5px dashed var(--cream)}
.tear-progress{position:absolute;top:calc(17% - 2px);left:0;height:3px;width:0;background:var(--ink);pointer-events:none}

/* card */
.card-wrap{position:absolute;width:var(--cw);height:var(--ch);opacity:0;transform:translateY(180px) scale(.8);pointer-events:none;transform-style:preserve-3d}
.stage.revealed .card-wrap{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:auto}
@keyframes rise{
  0%{opacity:0;transform:translateY(180px) scale(.8)}
  60%{opacity:1;transform:translateY(-24px) scale(1.02)}
  100%{opacity:1;transform:translateY(0) scale(1)}}
.card{position:absolute;inset:0;transform-style:preserve-3d;cursor:pointer;
  transform:scale(1) rotateZ(0deg) rotateY(-360deg);border-radius:12px}
.card.moving{transition:transform .9s cubic-bezier(.45,.05,.2,1)}
.card.spin{transition:transform 1.4s cubic-bezier(.2,.75,.25,1)}
.card:focus-visible{outline:2px solid var(--accent-2);outline-offset:6px}
.face{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 3px 6px rgba(0,0,0,.4);background:#111}
.face img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.face.back{width:var(--bw);height:var(--bh);left:calc((var(--cw) - var(--bw)) / 2);top:calc((var(--ch) - var(--bh)) / 2);right:auto;bottom:auto;transform:rotateY(180deg) rotateZ(90deg)}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.45;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 47%,rgba(255,255,255,.05) 55%,transparent 65%) 0 0/300% 100%;
  animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,15%{background-position:120% 0}55%,100%{background-position:-60% 0}}

/* controls: printed tickets */
.controls{display:flex;flex-direction:column;align-items:center;gap:6px}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.btnrow:first-child{min-height:38px}
@media (min-width:700px){.btns{flex-direction:row;gap:8px}.btnrow{flex-wrap:nowrap}.btnrow:first-child:empty,.btnrow:first-child{min-height:0}}
@media (max-width:420px){button,a.btnlink{font-size:12px !important;padding:9px 12px !important;letter-spacing:.08em !important}}
button,a.btnlink{font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:3px;padding:10px 18px;cursor:pointer;
  border:1.5px solid var(--fg-muted);background:transparent;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center}
button.primary{background:var(--cream);color:var(--ink);border-color:var(--cream)}
button:hover,a.btnlink:hover{background:rgba(255,255,255,.07)}
button.primary:hover{background:#fff}
a.btnlink{border-color:var(--accent-2);color:var(--accent-2)}
a.btnlink:focus-visible,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.hint{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--fg-muted);text-align:center;min-height:1.5em;margin:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Draft Class · Series 52</div>
    <h1>A <em>one-of-one</em> pull is waiting</h1>
    <p>Tear along the crimp to open the pack.</p>
    <div class="rule"><span>NEW VERTICAL GTM EXECUTION STRATEGY</span></div>
  </header>

  <section class="stage" id="stage" aria-label="Card pack">
    <div class="glow"></div>

    <div class="pack idle" id="pack">
      <div class="foil body-part"></div>
      <div class="pack-label">
        <div class="series">CORNER-STORE EDITION</div>
        <div class="badge"><span class="k">ROOKIE · 1 OF 1</span><div class="big">Draft<br>Pack</div><span class="no">Card No. 318</span></div>
        <div class="count">1 GRADED CARD INSIDE</div>
      </div>
      <div class="foil strip" id="strip" role="button" tabindex="0" aria-label="Tear open the pack">
        <div class="tear-hint"><i></i>TEAR HERE<i></i></div>
      </div>
      <div class="tear-progress" id="prog"></div>
    </div>

    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card" role="button" tabindex="-1" aria-label="Alfonso Pintor card, front. Tap to flip.">
        <div class="face front"><img src="card-front-v3.jpg" alt="Alfonso Pintor graded card, front"><div class="shine"></div></div>
        <div class="face back"><img src="card-back-gtm-final.jpg" alt="Alfonso Pintor graded card, back: professional summary and market records"><div class="shine"></div></div>
      </div>
    </div>
  </section>

  <div class="controls">
    <div class="btns">
      <div class="btnrow">
        <button class="primary" id="openBtn">Open pack</button>
        <button class="primary" id="flipBtn" hidden>Flip card</button>
        <button id="replayBtn" hidden>Rip it again</button>
      </div>
      <div class="btnrow">
        <a class="btnlink" href="Alfonso_Pintor_Resume_GTM.pdf" target="_blank" rel="noopener">View resume</a>
        <a class="btnlink" href="Alfonso_Pintor_Certificate_GTM_Execution.pdf" target="_blank" rel="noopener">View certificate</a>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(function(){
  const stage=document.getElementById('stage'), pack=document.getElementById('pack'),
        strip=document.getElementById('strip'), prog=document.getElementById('prog'),
        card=document.getElementById('card'), openBtn=document.getElementById('openBtn'),
        replayBtn=document.getElementById('replayBtn'), flipBtn=document.getElementById('flipBtn'), hint=document.getElementById('hint');
  let opened=false, dragging=false, startX=0, best=0, n=0, busy=false, timers=[];

  // n counts flips: even = front (portrait), odd = back (turned to landscape)
  // size the card from the screen: portrait front fits the height, landscape back scales up to fill the stage
  const root=document.documentElement; let cw=300, ls=1;
  function size(){
    const w=stage.clientWidth, hdr=document.querySelector('header').offsetHeight, ctl=document.querySelector('.controls').offsetHeight;
    const h=Math.max(300, window.innerHeight - hdr - ctl - 16 - 28 - 20);
    cw=Math.max(200, Math.min(w, h/1.5, 620));
    const r=1639/960, bw=Math.max(300, Math.min(w, h*r, 1639)), bh=bw/r;
    root.style.setProperty('--cw', cw+'px');
    root.style.setProperty('--bw', bw+'px'); root.style.setProperty('--bh', bh+'px');
    stage.style.setProperty('--sh', h+'px');
    const pw=Math.min(w*0.86, (h-16)*250/370, 520); root.style.setProperty('--pz', (pw/250).toFixed(3));
    if(opened){ card.classList.remove('moving','spin'); card.style.transform=pose(); }
  }
  function pose(){ return 'scale(' + (n%2 ? ls : 1) + ') rotateZ(' + (n%2 ? -90 : 0) + 'deg) rotateY(' + (n*180) + 'deg)'; }
  size(); window.addEventListener('resize', size);
  function flip(){
    if(!opened || busy) return;
    busy=true; n++;
    card.classList.remove('spin'); card.classList.add('moving');
    card.style.transform=pose();
    card.setAttribute('aria-label','Alfonso Pintor card, '+(n%2?'back':'front')+'. Tap to flip.');
    setTimeout(()=>{busy=false},900);
  }
  function open(){
    if(opened) return; opened=true;
    prog.style.width='100%';
    pack.classList.remove('idle'); pack.classList.add('shake');
    openBtn.hidden=true;
    timers.push(setTimeout(()=>strip.classList.add('torn'),300));
    timers.push(setTimeout(()=>{
      pack.classList.add('gone'); stage.classList.add('revealed');
      card.classList.add('spin'); n=0; card.style.transform=pose();   // spin up onto the front
      card.tabIndex=0;
    },850));
    timers.push(setTimeout(()=>{ busy=false; flip(); },850+1400+1600)); // hold the front, then turn to the back
    timers.push(setTimeout(()=>{ replayBtn.hidden=false; flipBtn.hidden=false; hint.textContent=(window.innerWidth < 700 && window.innerHeight > window.innerWidth) ? 'Tap card to flip · turn phone sideways to enlarge' : 'Tap the card or use Flip card'; },850+1400+1600+900));
    busy=true;
  }
  function reset(){
    timers.forEach(clearTimeout); timers=[];
    opened=false; best=0; n=0; busy=false; prog.style.width='0';
    stage.classList.remove('revealed');
    card.classList.remove('moving','spin'); card.style.transform='scale(1) rotateZ(0deg) rotateY(-360deg)'; card.tabIndex=-1;
    strip.classList.remove('torn'); pack.classList.remove('gone','shake'); pack.classList.add('idle');
    openBtn.hidden=false; replayBtn.hidden=true; flipBtn.hidden=true; hint.textContent='';
  }
  card.addEventListener('click',flip);
  card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } });

  strip.addEventListener('pointerdown',e=>{ if(opened)return; dragging=true; startX=e.clientX; best=0; strip.setPointerCapture(e.pointerId); pack.classList.remove('idle'); });
  strip.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const p=Math.min(1,Math.abs(e.clientX-startX)/(pack.offsetWidth*0.7));
    best=Math.max(best,p); prog.style.width=(best*100)+'%';
    if(best>=1){ dragging=false; open(); }
  });
  const end=()=>{ if(!dragging) return; dragging=false;
    if(best>.55 || best<.05) open(); else { best=0; prog.style.width='0'; pack.classList.add('idle'); } };
  strip.addEventListener('pointerup',end); strip.addEventListener('pointercancel',end);
  strip.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  openBtn.addEventListener('click',open);
  flipBtn.addEventListener('click',flip);
  replayBtn.addEventListener('click',reset);
})();
</script>
</body>
</html>
